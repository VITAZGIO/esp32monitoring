; PlatformIO project config — esp32monitoring
; Плата: ESP32 Dev Module

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; PlatformIO сам определяет порт при аплоаде/мониторе — ничего выбирать руками не надо

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    knolleary/PubSubClient @ ^2.8
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    sui77/rc-switch @ ^2.6.4

; ------------------------------------------------------------------
; Конфиг TFT_eSPI задаётся прямо здесь через build_flags — не нужно
; лезть и редактировать User_Setup.h внутри библиотеки, как в Arduino IDE.
; Пины взяты с твоей рукописной схемы (МОНИТОР):
;   SCL(SCLK)=P18  SDA(MOSI)=P23  RST=P4  DC=P2  CS=P5  BLK=P15
; ------------------------------------------------------------------
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_GREENTAB=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=15
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1